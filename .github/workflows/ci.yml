name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (tag in the trailing comment).
# The ACF Pro licence is passed only to the steps that download ACF Pro.

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint

  acf-pro:
    name: ACF Pro licence
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          ACF_PRO_LICENSE: ${{ secrets.ACF_PRO_LICENSE }}
        run: |
          if [ -n "$ACF_PRO_LICENSE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "The ACF_PRO_LICENSE secret is available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=ACF Pro licence unavailable::The ACF_PRO_LICENSE secret is not available to this run (for example a pull request from a fork or Dependabot). PHPUnit, Plugin Check and Playwright need ACF Pro in wp-env and are skipped."
          fi

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    needs: acf-pro
    if: needs.acf-pro.outputs.available == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5', '8.6']
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npm run env:start
        env:
          ACF_PRO_LICENSE: ${{ secrets.ACF_PRO_LICENSE }}
      - name: Check the PHP version PHPUnit runs on
        run: |
          npx wp-env run tests-cli php -r 'echo "PHP ", PHP_VERSION, PHP_EOL; exit( str_starts_with( PHP_VERSION, "${{ matrix.php }}." ) ? 0 : 1 );'
      - run: npm run test:php

  e2e:
    name: Plugin Check and Playwright
    needs: acf-pro
    if: needs.acf-pro.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run env:start
        env:
          ACF_PRO_LICENSE: ${{ secrets.ACF_PRO_LICENSE }}
      - name: Check the PHP version WordPress runs on
        run: |
          npx wp-env run cli php -r 'echo "PHP ", PHP_VERSION, PHP_EOL; exit( str_starts_with( PHP_VERSION, "8.3." ) ? 0 : 1 );'
      - run: npm run plugin-check
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
